[package]
name = "librptadvdcs"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Portable DCS receive and transmit ABI for rpt_advanced"
repository = "https://github.com/cpeter1207/librptadvdcs"
publish = false

[lib]
name = "rptadvdcs"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
